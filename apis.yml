aid: enigma-health
name: Enigma Health
description: 'Enigma Health (Enigma Global eHealth) is a Netherlands-based digital health startup building
  a secure, private eHealth portal intended to connect patients, doctors and healthcare institutions,
  and to give patients lifelong, worldwide access to their own electronic health record together with
  a digital vaccine passport kept in sync with that record. Founded by Dutch GP and global-health researcher
  Remko Schats and incubated at UtrechtInc, the company is a Startup level Industry Partner of the openEHR
  International Foundation, placing its intended data layer on the openEHR clinical data platform standard
  rather than a proprietary record format. As of September 2026 the company is pre-launch: enigma-health.org
  serves a single ''Coming Soon'' page and Enigma Health publishes no API, SDK, developer portal or machine-readable
  contract.'
